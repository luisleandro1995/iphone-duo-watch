name: iPhone Duo pickup watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking stock"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install playwright==1.48.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.0
      - run: python -m playwright install --with-deps chromium
      - name: Check stock
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python check.py ${{ inputs.test_email && '--test-email' || '' }}
      - name: Save alert state
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update alert state" && git push)
